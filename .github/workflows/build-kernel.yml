name: Build S23FE Kernel (Cached + Flashable ZIP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VARIANT: r11s
  OUT_DIR: out
  ANYKERNEL_DIR: AnyKernel3
  ZIP_NAME: ""  # Will be set after ZIP creation

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # Cache Clang
      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang-r416183b
          key: ${{ runner.os }}-clang-r416183b-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-clang-r416183b-

      # Cache GAS
      - name: Cache GAS
        id: cache-gas
        uses: actions/cache@v4
        with:
          path: ~/gas-linux-x86
          key: ${{ runner.os }}-gas-linux-x86-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-gas-linux-x86-

      # Cache Build Tools
      - name: Cache Build Tools
        id: cache-build-tools
        uses: actions/cache@v4
        with:
          path: ~/build-tools
          key: ${{ runner.os }}-build-tools-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-build-tools-

      # Cache ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake lzop gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev make optipng flex bison gcc clang lld libncurses-dev libssl-dev libelf-dev
          ccache --max-size=5G
          ccache -z

      # Download Clang
      - name: Download Clang (if cache miss)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: git clone https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b ~/clang-r416183b --depth=1

      # Download GAS
      - name: Download GAS (if cache miss)
        if: steps.cache-gas.outputs.cache-hit != 'true'
        run: git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 ~/gas-linux-x86 --depth=1

      # Download Build Tools
      - name: Download Build Tools (if cache miss)
        if: steps.cache-build-tools.outputs.cache-hit != 'true'
        run: git clone https://android.googlesource.com/platform/prebuilts/build-tools ~/build-tools --depth=1

      - name: Set up environment
        run: |
          echo "DIR=$(pwd)" >> $GITHUB_ENV
          echo "CROSS_COMPILE=~/clang-r416183b/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=~/clang-r416183b/bin/clang" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KERNEL_MAKE_ENV=LOCALVERSION=-v1.0 CCACHE=ccache" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Muktox" >> $GITHUB_ENV
          echo "PATH=~/clang-r416183b/bin:~/build-tools/linux-x86/bin:~/gas-linux-x86:$PATH" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          mkdir -p ${{ env.OUT_DIR }}
          make -j$(nproc) exynos2200_${{ env.VARIANT }}_defconfig
          make -j$(nproc) $KERNEL_MAKE_ENV
          make -j$(nproc) dtbs
          mkdtimg cfg_create ${{ env.OUT_DIR }}/dtbo.img dtconfigs/r11s.cfg -d arch/arm64/boot/dts/samsung/r11s
          mkdtimg cfg_create ${{ env.OUT_DIR }}/dtb.img dtconfigs/exynos2200.cfg -d arch/arm64/boot/dts/exynos
          cp arch/arm64/boot/Image ${{ env.OUT_DIR }}/Image || true
          cp arch/arm64/boot/Image.gz ${{ env.OUT_DIR }}/Image.gz || true
          ccache -s

      - name: Create flashable ZIP
        run: |
          cd ${{ env.ANYKERNEL_DIR }} || exit 1
          rm -rf *.zip
          cp ${{ env.OUT_DIR }}/Image Image
          cp ${{ env.OUT_DIR }}/dtbo.img dtbo
          cp ${{ env.OUT_DIR }}/dtb.img dtb
          ZIP_NAME="${{ env.VARIANT }}_kernel_$(cat ../include/config/kernel.release)_$(date '+%Y_%m_%d').zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          cd ..

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Kernel Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload flashable ZIP
        if: ${{ hashFiles(format('{0}/{1}', env.ANYKERNEL_DIR, env.ZIP_NAME)) != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.ANYKERNEL_DIR }}/${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip
