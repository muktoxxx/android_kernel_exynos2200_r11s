```yaml
name: Build S23FE Kernel

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake lzop gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev make optipng flex bison gcc clang lld libncurses-dev libssl-dev libelf-dev

      - name: Clone required toolchains
        run: |
          PARENT_DIR=$(dirname $(pwd))
          git clone https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b $PARENT_DIR/clang-r416183b --depth=1
          git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 $PARENT_DIR/gas/linux-x86 --depth=1
          git clone https://android.googlesource.com/platform/prebuilts/build-tools $PARENT_DIR/build-tools --depth=1

      - name: Set up environment
        run: |
          echo "PARENT_DIR=$(dirname $(pwd))" >> $GITHUB_ENV
          echo "DIR=$(pwd)" >> $GITHUB_ENV
          echo "OUT_DIR=$(pwd)/out" >> $GITHUB_ENV
          echo "CROSS_COMPILE=${{ env.PARENT_DIR }}/clang-r416183b/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=${{ env.PARENT_DIR }}/clang-r416183b/bin/clang" >> $GITHUB_ENV
          echo "PLATFORM_VERSION=15" >> $GITHUB_ENV
          echo "ANDROID_MAJOR_VERSION=v" >> $GITHUB_ENV
          echo "TARGET_SOC=s5e9925" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KERNEL_MAKE_ENV=LOCALVERSION=-v1.0" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Chanz22" >> $GITHUB_ENV
          echo "PATH=${{ env.PARENT_DIR }}/clang-r416183b/bin:${{ env.PARENT_DIR }}/build-tools/path/linux-x86:${{ env.PARENT_DIR }}/gas/linux-x86:$PATH" >> $GITHUB_ENV
          echo "VARIANT=r11s" >> $GITHUB_ENV  # Assuming default variant 'r11s' based on script

      - name: Clean directories
        run: |
          make clean
          make mrproper
          rm -rf ${{ env.OUT_DIR }}

      - name: Build kernel
        run: |
          mkdir -p ${{ env.OUT_DIR }}
          make -j$(nproc --all) ${{ env.KERNEL_MAKE_ENV }} exynos2200_${{ env.VARIANT }}_defconfig JollyKernel.config dtbs
          make -j$(nproc --all) ${{ env.KERNEL_MAKE_ENV }}
          ./${{ env.DIR }}/toolchain/mkdtimg cfg_create ${{ env.OUT_DIR }}/dtbo.img dtconfigs/r11s.cfg -d arch/arm64/boot/dts/samsung/r11s
          ./${{ env.DIR }}/toolchain/mkdtimg cfg_create ${{ env.OUT_DIR }}/dtb.img dtconfigs/exynos2200.cfg -d arch/arm64/boot/dts/exynos
          if [ -e arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz ${{ env.OUT_DIR }}/Image.gz
          fi
          if [ -e arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image ${{ env.OUT_DIR }}/Image
          fi

      - name: Create flashable ZIP
        run: |
          cd AnyKernel3 || exit 1
          rm -rf *.zip
          cp ${{ env.DIR }}/arch/arm64/boot/Image Image
          cp ${{ env.OUT_DIR }}/dtbo.img dtbo
          cp ${{ env.OUT_DIR }}/dtb.img dtb
          KERNEL_VERSION=$(cat ${{ env.DIR }}/include/config/kernel.release)
          ZIP_NAME="${{ env.VARIANT }}_kernel_${KERNEL_VERSION}_$(date +%Y_%m_%d).zip"
          zip -r9 "${ZIP_NAME}" * -x .git README.md *placeholder
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          cd ${{ env.DIR }}

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Kernel Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload kernel image to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.OUT_DIR }}/Image
          asset_name: Image
          asset_content_type: application/octet-stream
        if: ${{ hashFiles(format('{0}/Image', env.OUT_DIR)) != '' }}

      - name: Upload kernel Image.gz to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.OUT_DIR }}/Image.gz
          asset_name: Image.gz
          asset_content_type: application/gzip
        if: ${{ hashFiles(format('{0}/Image.gz', env.OUT_DIR)) != '' }}

      - name: Upload flashable ZIP to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: AnyKernel3/${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip
```
