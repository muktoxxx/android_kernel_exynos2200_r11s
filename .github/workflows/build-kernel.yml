name: Build S23FE Kernel (Cached + Out-of-Tree + Flashable ZIP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VARIANT: r11s
  OUT_DIR: out
  ANYKERNEL_DIR: AnyKernel3

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # Cache Clang
      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ~/clang-r416183b
          key: ${{ runner.os }}-clang-r416183b-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-clang-r416183b-

      # Cache GAS
      - name: Cache GAS
        id: cache-gas
        uses: actions/cache@v4
        with:
          path: ~/gas-linux-x86
          key: ${{ runner.os }}-gas-linux-x86-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-gas-linux-x86-

      # Cache Build Tools
      - name: Cache Build Tools
        id: cache-build-tools
        uses: actions/cache@v4
        with:
          path: ~/build-tools
          key: ${{ runner.os }}-build-tools-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-build-tools-

      # Cache ccache
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.run_number }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake lzop gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev make optipng flex bison gcc clang lld libncurses-dev libssl-dev libelf-dev
          ccache --max-size=5G
          ccache -z

      - name: Download Clang (if cache miss)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: git clone https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b ~/clang-r416183b --depth=1

      - name: Download GAS (if cache miss)
        if: steps.cache-gas.outputs.cache-hit != 'true'
        run: git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 ~/gas-linux-x86 --depth=1

      - name: Download Build Tools (if cache miss)
        if: steps.cache-build-tools.outputs.cache-hit != 'true'
        run: git clone https://android.googlesource.com/platform/prebuilts/build-tools ~/build-tools --depth=1

      - name: Set environment variables
        run: |
          echo "DIR=$(pwd)" >> $GITHUB_ENV
          echo "OUT_DIR=$(pwd)/out" >> $GITHUB_ENV
          echo "ANYKERNEL_DIR=$(pwd)/AnyKernel3" >> $GITHUB_ENV
          echo "CROSS_COMPILE=~/clang-r416183b/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=~/clang-r416183b/bin/clang" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "KERNEL_MAKE_ENV=LOCALVERSION=-v1.0 CCACHE=ccache" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Chanz22" >> $GITHUB_ENV
          echo "PATH=~/clang-r416183b/bin:~/build-tools/linux-x86/bin:~/gas-linux-x86:$PATH" >> $GITHUB_ENV

      - name: Determine if build needed
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "no_changes=false" >> $GITHUB_ENV
          else
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(arch|drivers|include|kernel)/' || true)
            else
              CHANGED="all"
            fi

            if [ -z "$CHANGED" ]; then
              echo "no_changes=true" >> $GITHUB_ENV
            else
              echo "no_changes=false" >> $GITHUB_ENV
            fi

      - name: Clean build if needed
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DEFCONFIG_CHANGED=$(git diff --name-only HEAD~1 HEAD -- | grep -E "^arch/arm64/configs/exynos2200_${VARIANT}_defconfig" || true)
          else
            DEFCONFIG_CHANGED="true"
          fi

          if [ "${{ github.event_name }}" == "push" ] && ([ -n "$DEFCONFIG_CHANGED" ] || [ "${{ env.no_changes }}" != "true" ]); then
            echo "Cleaning build..."
            make -C . O="$OUT_DIR" mrproper
          else
            echo "Skipping clean"
          fi

      - name: Build kernel
        run: |
          mkdir -p "$OUT_DIR"

          # Defconfig with host gcc
          make -j$(nproc) -C . O="$OUT_DIR" exynos2200_${VARIANT}_defconfig

          # Kernel build with Clang cross-compiler
          make -j$(nproc) -C . O="$OUT_DIR" CC="$CC" CROSS_COMPILE="$CROSS_COMPILE" $KERNEL_MAKE_ENV
          make -j$(nproc) -C . O="$OUT_DIR" dtbs

          # Create dtbo and dtb images
          mkdtimg cfg_create "$OUT_DIR/dtbo.img" dtconfigs/r11s.cfg -d arch/arm64/boot/dts/samsung/r11s
          mkdtimg cfg_create "$OUT_DIR/dtb.img" dtconfigs/exynos2200.cfg -d arch/arm64/boot/dts/exynos

      - name: Create flashable ZIP
        run: |
          cd $ANYKERNEL_DIR || exit 1
          rm -rf *.zip
          cp "$OUT_DIR/Image" Image
          cp "$OUT_DIR/dtbo.img" dtbo
          cp "$OUT_DIR/dtb.img" dtb
          ZIP_NAME="${VARIANT}_kernel_$(cat "$DIR/include/config/kernel.release")_$(date '+%Y_%m_%d').zip"
          zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          cd "$DIR"

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Kernel Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload kernel Image
        if: ${{ hashFiles(format('{0}/Image', env.OUT_DIR)) != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.OUT_DIR }}/Image
          asset_name: Image
          asset_content_type: application/octet-stream

      - name: Upload kernel Image.gz
        if: ${{ hashFiles(format('{0}/Image.gz', env.OUT_DIR)) != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.OUT_DIR }}/Image.gz
          asset_name: Image.gz
          asset_content_type: application/gzip

      - name: Upload flashable ZIP
        if: ${{ hashFiles(format('{0}/{1}', env.ANYKERNEL_DIR, env.ZIP_NAME)) != '' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ ANYKERNEL_DIR }}/${{ env.ZIP_NAME }}
          asset_name: ${{ env.ZIP_NAME }}
          asset_content_type: application/zip
