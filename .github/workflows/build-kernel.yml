name: Build S23FE Kernel (Cached + Trigger-aware + Flashable ZIP)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VARIANT: r11s
  OUT_DIR: out
  ANYKERNEL_DIR: AnyKernel3
  CLANG_DIR: clang-r416183b
  GAS_DIR: gas-linux-x86
  BUILD_TOOLS_DIR: build-tools

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0  # Needed for HEAD~1

    # Cache Clang
    - name: Cache Clang
      id: cache-clang
      uses: actions/cache@v4
      with:
        path: ~/${{ env.CLANG_DIR }}
        key: ${{ runner.os }}-${{ env.CLANG_DIR }}-${{ github.run_number }}
        restore-keys: |
          ${{ runner.os }}-${{ env.CLANG_DIR }}-

    # Cache GAS
    - name: Cache GAS
      id: cache-gas
      uses: actions/cache@v4
      with:
        path: ~/${{ env.GAS_DIR }}
        key: ${{ runner.os }}-${{ env.GAS_DIR }}-${{ github.run_number }}
        restore-keys: |
          ${{ runner.os }}-${{ env.GAS_DIR }}-

    # Cache Build Tools
    - name: Cache Build Tools
      id: cache-build-tools
      uses: actions/cache@v4
      with:
        path: ~/${{ env.BUILD_TOOLS_DIR }}
        key: ${{ runner.os }}-${{ env.BUILD_TOOLS_DIR }}-${{ github.run_number }}
        restore-keys: |
          ${{ runner.os }}-${{ env.BUILD_TOOLS_DIR }}-

    # Cache ccache
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ github.run_number }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake lzop gperf build-essential zip curl \
          zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
          squashfs-tools pngcrush schedtool dpkg-dev make optipng flex bison gcc clang lld \
          libncurses-dev libssl-dev libelf-dev
        ccache --max-size=5G
        ccache -z

    # Download Clang if cache miss
    - name: Download Clang
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: git clone https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b ~/${{ env.CLANG_DIR }} --depth=1

    # Download GAS if cache miss
    - name: Download GAS
      if: steps.cache-gas.outputs.cache-hit != 'true'
      run: git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 ~/${{ env.GAS_DIR }} --depth=1

    # Download Build Tools if cache miss
    - name: Download Build Tools
      if: steps.cache-build-tools.outputs.cache-hit != 'true'
      run: git clone https://android.googlesource.com/platform/prebuilts/build-tools ~/${{ env.BUILD_TOOLS_DIR }} --depth=1

    - name: Set environment variables
      run: |
        echo "DIR=$(pwd)" >> $GITHUB_ENV
        echo "OUT_DIR=$(pwd)/${{ env.OUT_DIR }}" >> $GITHUB_ENV
        echo "CROSS_COMPILE=~/${{ env.CLANG_DIR }}/bin/aarch64-linux-gnu-" >> $GITHUB_ENV
        echo "CC=~/${{ env.CLANG_DIR }}/bin/clang" >> $GITHUB_ENV
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "KERNEL_MAKE_ENV=LOCALVERSION=-v1.0 CCACHE=ccache" >> $GITHUB_ENV
        echo "KBUILD_BUILD_USER=Muktox" >> $GITHUB_ENV
        echo "PATH=~/${{ env.CLANG_DIR }}/bin:~/${{ env.BUILD_TOOLS_DIR }}/linux-x86/bin:~/${{ env.GAS_DIR }}:$PATH" >> $GITHUB_ENV

    - name: Determine if build needed
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "no_changes=false" >> $GITHUB_ENV
        else
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^(arch|drivers|include|kernel)/' || true)
          else
            CHANGED="all"
          fi

          if [ -z "$CHANGED" ]; then
            echo "no_changes=true" >> $GITHUB_ENV
          else
            echo "no_changes=false" >> $GITHUB_ENV
          fi

    - name: Clean build if needed (defconfig-aware)
      run: |
        if git rev-parse HEAD~1 >/dev/null 2>&1; then
          DEFCONFIG_CHANGED=$(git diff --name-only HEAD~1 HEAD -- | grep -E "^arch/arm64/configs/exynos2200_${{ env.VARIANT }}_defconfig" || true)
        else
          DEFCONFIG_CHANGED="true"
        fi

        if [ "${{ github.event_name }}" == "push" ] && ([ -n "$DEFCONFIG_CHANGED" ] || [ "${{ env.no_changes }}" != "true" ]); then
            echo "Cleaning build because defconfig changed or major changes detected..."
            make clean
            make mrproper
            rm -rf "${{ env.OUT_DIR }}"
        else
            echo "Skipping clean: minor changes only or workflow_dispatch"

    - name: Build kernel
      run: |
        mkdir -p "${{ env.OUT_DIR }}"
        make -j$(nproc) exynos2200_${{ env.VARIANT }}_defconfig
        make -j$(nproc) $KERNEL_MAKE_ENV
        make -j$(nproc) dtbs
        ./toolchain/mkdtimg cfg_create "${{ env.OUT_DIR }}/dtbo.img" dtconfigs/r11s.cfg -d arch/arm64/boot/dts/samsung/r11s
        ./toolchain/mkdtimg cfg_create "${{ env.OUT_DIR }}/dtb.img" dtconfigs/exynos2200.cfg -d arch/arm64/boot/dts/exynos
        [ -e arch/arm64/boot/Image.gz ] && cp arch/arm64/boot/Image.gz "${{ env.OUT_DIR }}/"
        [ -e arch/arm64/boot/Image ] && cp arch/arm64/boot/Image "${{ env.OUT_DIR }}/"
        ccache -s

    - name: Create flashable ZIP
      run: |
        cd ${{ env.ANYKERNEL_DIR }} || exit 1
        rm -rf *.zip
        cp "$DIR/arch/arm64/boot/Image" Image
        cp "${{ env.OUT_DIR }}/dtbo.img" dtbo
        cp "${{ env.OUT_DIR }}/dtb.img" dtb
        ZIP_NAME="${{ env.VARIANT }}_kernel_$(cat "$DIR/include/config/kernel.release")_$(date +%Y_%m_%d).zip"
        zip -r9 "$ZIP_NAME" * -x .git README.md *placeholder
        echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
        cd "$DIR"

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Kernel Release ${{ github.ref_name }}
        draft: false
        prerelease: false

    - name: Upload kernel Image
      if: ${{ hashFiles(format('{0}/Image', env.OUT_DIR)) != '' }}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.OUT_DIR }}/Image
        asset_name: Image
        asset_content_type: application/octet-stream

    - name: Upload kernel Image.gz
      if: ${{ hashFiles(format('{0}/Image.gz', env.OUT_DIR)) != '' }}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.OUT_DIR }}/Image.gz
        asset_name: Image.gz
        asset_content_type: application/gzip

    - name: Upload flashable ZIP
      if: ${{ hashFiles(format('{0}/{1}', env.ANYKERNEL_DIR, env.ZIP_NAME)) != '' }}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ env.ANYKERNEL_DIR }}/${{ env.ZIP_NAME }}
        asset_name: ${{ env.ZIP_NAME }}
        asset_content_type: application/zip
