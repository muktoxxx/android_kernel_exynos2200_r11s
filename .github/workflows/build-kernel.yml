name: Build & Release Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake lzop gperf build-essential zip curl \
            zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev \
            squashfs-tools pngcrush schedtool dpkg-dev make optipng flex bison gcc clang lld \
            libncurses-dev libssl-dev libelf-dev

      - name: Prepare toolchains and support dirs
        run: |
          # Clone prebuilt Clang, GAS, and build-tools if they don't exist
          [ ! -d ../clang-r416183b ] && git clone https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b ../clang-r416183b
          [ ! -d ../gas/linux-x86 ] && git clone https://android.googlesource.com/platform/prebuilts/gas/linux-x86 ../gas/linux-x86
          [ ! -d ../build-tools ] && git clone https://android.googlesource.com/platform/prebuilts/build-tools ../build-tools

      - name: Build all variants and make ZIP
        shell: bash
        run: |
          set -e

          export DIR="$(pwd)"
          export PARENT_DIR="$(readlink -f "$DIR/..")"
          export PATH="$PARENT_DIR/clang-r416183b/bin:$PARENT_DIR/build-tools/path/linux-x86:$PARENT_DIR/gas/linux-x86:$PATH"
          export CROSS_COMPILE="$PARENT_DIR/clang-r416183b/bin/aarch64-linux-gnu-"
          export CC="$PARENT_DIR/clang-r416183b/bin/clang"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          OUT_DIR="$DIR/out"

          configs=($(ls arch/arm64/configs/exynos2200_r11s_defconfig*))
          for config in "${configs[@]}"; do
            VARIANT=$(basename "$config" | cut -d'_' -f2)
            echo "Building variant: $VARIANT"

            make clean
            make mrproper
            rm -rf "$OUT_DIR"
            mkdir -p "$OUT_DIR"

            # Build kernel and dtbs explicitly with ARCH
            make -j$(nproc) ARCH=arm64 LOCALVERSION=-v1.0 "exynos2200_${VARIANT}_defconfig" "JollyKernel.config" dtbs
            make -j$(nproc) ARCH=arm64 LOCALVERSION=-v1.0

            # Generate dtbo and dtb images (if mkdtimg present)
            if [ -x ./toolchain/mkdtimg ]; then
              ./toolchain/mkdtimg cfg_create out/dtbo.img dtconfigs/r11s.cfg -d arch/arm64/boot/dts/samsung/r11s
              ./toolchain/mkdtimg cfg_create out/dtb.img dtconfigs/exynos2200.cfg -d arch/arm64/boot/dts/exynos
            fi

            # Copy Image to output
            [ -e arch/arm64/boot/Image ] && cp arch/arm64/boot/Image "$OUT_DIR/Image"

            # Build AnyKernel3 zip if AnyKernel3 directory exists
            if [ -d AnyKernel3 ]; then
              cd AnyKernel3
              rm -rf *.zip
              cp "$DIR/arch/arm64/boot/Image" Image
              [ -e "$DIR/out/dtbo.img" ] && cp "$DIR/out/dtbo.img" dtbo
              [ -e "$DIR/out/dtb.img" ] && cp "$DIR/out/dtb.img" dtb
              ZIPNAME="${VARIANT}_kernel_$(cat "$DIR/include/config/kernel.release")_$(date '+%Y_%m_%d').zip"
              zip -r9 "$ZIPNAME" * -x .git README.md *placeholder
              mv "$ZIPNAME" "$OUT_DIR/"
              cd "$DIR"
            fi
          done

      - name: Upload Artifacts (Image, dtbo.img, dtb.img, zip)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-builds
          path: |
            out/*.zip
            out/Image
            out/dtb.img
            out/dtbo.img

      - name: Create GitHub Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
